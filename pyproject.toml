[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wisal-cli"
version = "0.1.0"
description = "Bilingual (Arabic/English) CLI tool to convert between JSON, CSV, and YAML"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Wisal Contributors" }
]
keywords = ["cli", "json", "csv", "yaml", "convert", "arabic", "bilingual", "i18n"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Localization",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
wisal = "wisal.cli:main"

[project.urls]
Homepage = "https://github.com/amgdsaleh66/wisal"
Issues = "https://github.com/amgdsaleh66/wisal/issues"

[tool.setuptools.packages.find]
include = ["wisal*"]
